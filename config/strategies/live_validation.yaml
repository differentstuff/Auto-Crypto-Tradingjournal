# live_validation.yaml — Strategy config for live validation scripts.
# 1x leverage, paper_mode=false, minimal settings.
# Used by scripts/live_validation/ to test exchange API actions against real Bitget.
#
# IMPORTANT: This strategy is NOT for production trading.
# It exists solely to give ConfigLoader a valid strategy YAML with
# paper_mode=false and leverage=1 so validation scripts can call
# the real exchange API.

strategy:
  name: live_validation
  timeframe: "30m"
  cycle_interval_minutes: 15
  max_positions: 1

daemon:
  paper_mode: false

exchange:
  mode: live

portfolio:
  leverage: 1

learning:
  min_trades_before_adjusting: 30
  min_trades_per_signal: 15
  significance_level: 0.05
  rulebook_max_rules: 10
  retrain_every_n_trades: 10
  track_idle_cycles: true
  trajectory_lookback_hours: 48
  trajectory_min_hours: 8
  trajectory_thresholds:
    stable_consensus: 10
    gradual_alignment: 8
    earlier_min: 3
    recent_min: 2
    earlier_low: 2
    min_alignment: 4
  contrarian_win_rate: 30.0
  highlight_threshold: 75.0
  monitor_low_threshold: 55.0
  suppress_range:
    - 45.0
    - 55.0
  contrarian_threshold: 30.0
  adjustment_boost: 1.2
  adjustment_review_reduce: 0.9
